<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Gin Study</title>
<!-- 本地静态资源：Bootstrap 5.3.3 + 公共样式（登录页不加载 amis SDK） -->
<link rel="stylesheet" href="/admin/static/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/admin/static/common/app.css?v=20260906j">
</head>
<body class="login-page" id="loginPage">

<div class="login-card">
  <div class="login-panel">
    <div class="text-center mb-4">
      <div class="login-logo mb-1">Gin Study</div>
      <div class="login-title">后台管理系统 · 登录</div>
    </div>

    <div class="alert d-none" id="loginAlert" role="alert">
      <span id="loginAlertText"></span>
    </div>

    <form id="loginForm" autocomplete="off" novalidate>
      <div class="mb-3">
        <label class="form-label" for="username">用户名</label>
        <input type="text" class="form-control" id="username" placeholder="请输入用户名" autofocus required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">密码</label>
        <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">记住我</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="loginBtn">登 录</button>
    </form>
  </div>
  <p class="text-center text-white-50 mt-3 mb-0" style="font-size:12px">&copy; 2026 Gin Study · 后台管理系统</p>
</div>

<script src="/admin/static/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/admin/static/common/app.js?v=20260906l"></script>
</body>
</html>
