<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gin Study · 管理后台</title>
<!-- 本地静态资源：Bootstrap 5.3.3（骨架）、amis 6.13（sdk.css 内含 cxd 主题与 FontAwesome）、公共样式。
     FontAwesome 只保留 amis 自带那一份，不再额外引入独立 all.min.css，避免字体重复下载。 -->
<link rel="stylesheet" href="/admin/static/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/admin/static/amis/sdk.css">
<link rel="stylesheet" href="/admin/static/common/app.css?v=20260906b">
</head>
<body class="app-shell" id="appShell">

<!-- 顶部导航（Bootstrap） -->
<nav class="navbar navbar-expand app-topbar">
  <div class="container-fluid px-3">
    <div class="d-flex align-items-center gap-2">
      <button class="icon-btn" type="button" id="sideToggle" aria-label="折叠侧栏">
        <i class="fa-solid fa-bars"></i>
      </button>
      <a class="navbar-brand" href="#/pages/home.json">
        <span class="brand-badge"><i class="fa-solid fa-gauge-high"></i></span>
        Gin Study
      </a>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="icon-btn" type="button" id="fullscreenBtn" aria-label="全屏">
        <i class="fa-regular fa-square"></i>
      </button>

      <div class="dropdown">
        <button class="btn d-flex align-items-center gap-2 border-0 dropdown-toggle" type="button"
                id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <span class="d-inline-flex align-items-center justify-content-center rounded-circle text-white"
                style="width:30px;height:30px;background:#2f6fed;font-size:13px;font-weight:600" id="topAvatar">管</span>
          <span class="user-name d-none d-md-inline" id="topUserName">管理员</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket me-2"></i>退出登录</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- 左侧菜单 -->
<aside class="app-sidebar">
  <nav id="sideMenu" class="side-menu"></nav>
</aside>

<!-- 主内容区：顶部多标签页 + 面包屑 + amis 页面容器 -->
<main class="app-main">
  <div class="page-tabs" id="pageTabs"></div>
  <div class="page-head">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb" id="breadcrumb">
        <li class="breadcrumb-item active">首页</li>
      </ol>
    </nav>
  </div>
  <div id="pageContent">
    <div class="content-hint"><div class="spinner-border spinner-border-sm text-primary"></div> 加载中…</div>
  </div>
</main>

<!-- 本地脚本：先 SDK、再公共逻辑 -->
<script src="/admin/static/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/admin/static/amis/sdk.min.js"></script>
<!-- 菜单配置（独立文件，先于 app.js 加载，app.js 读取 window.APP_MENU） -->
<script src="/admin/static/common/app_menu.js?v=20260906b"></script>
<script src="/admin/static/common/app.js?v=20260906d"></script>
</body>
</html>
