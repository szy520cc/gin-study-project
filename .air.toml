# air 热重载配置（make dev）
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
bin = "./tmp/server"
full_bin = "APP_ENV=dev ./tmp/server"
include_ext = ["go", "yaml", "yml"]
exclude_dir = ["build", "tmp", "logs", "docs", "vendor"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true
log = "air-build.log"

[log]
time = true

[misc]
clean_on_exit = true
